<style>
:root{
  --crimson:#0B4EA2; --crimson-ink:#14285C; --crimson-soft:#EDF3FB; --crimson-line:#CADCF2;
  --ink:#1D2029; --ink-2:#4B5160; --ink-3:#7A8090; --line:#E6E8EC; --line-2:#F1F2F5; --bg:#FFFFFF; --bg-2:#F8F9FB;
  --t1:#0B4EA2; --t2:#7FA9DD; --w:#B9BEC8; --etc:#DFE2E7;
  --radius:16px; --radius-sm:10px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard Variable",Pretendard,"Noto Sans KR",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
body{font-size:15px;line-height:1.55}
a{color:inherit}
button{font-family:inherit;cursor:pointer;color:inherit;background:none}
:root{color-scheme:light}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
.hidden{display:none !important}

header.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:saturate(1.4) blur(8px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:14px;height:64px}
.top a.home{display:flex;align-items:center;gap:12px;text-decoration:none;min-width:0}
.schools{margin-left:auto;display:flex;align-items:center;gap:4px;background:var(--bg-2);border:1px solid var(--line);border-radius:999px;padding:3px}
.schools a{display:inline-flex;align-items:center;gap:5px;text-decoration:none;font-size:13px;font-weight:650;color:var(--ink-2);padding:6px 12px;border-radius:999px;white-space:nowrap;transition:background-color .18s ease,color .18s ease}
.schools a.on{background:#fff;color:var(--crimson-ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.schools a.hm{color:var(--ink-3)}
@media (hover:hover) and (pointer:fine){.schools a:not(.on):hover{color:var(--ink)}}
@media (max-width:560px){.schools a.hm span{display:none}.schools a{padding:6px 10px;font-size:12.5px}.top .brand span{display:none}}
.logo{width:38px;height:38px;flex:none;display:block;filter:drop-shadow(0 2px 4px rgba(11,78,162,.25))}
.kv.kv2{grid-template-columns:1fr 1fr}
.v.na{white-space:nowrap;color:var(--ink-3);font-weight:600;font-size:15px}
.depts{display:flex;flex-wrap:wrap;gap:4px 14px;margin:0 0 10px}
.dept-b{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--ink-2);white-space:nowrap}
.dept-b img{height:13px;width:auto;flex:none;margin-right:2px}.dept-b i.sep{color:var(--line);margin:0 2px}
.dept-b i{font-style:normal;font-weight:600;color:var(--ink-3)}
.dhead{position:relative}
.dtags{margin:10px 0 14px}
.namerow{display:flex;justify-content:space-between;align-items:center;gap:20px}
.dside{display:flex;flex-direction:column;gap:10px;align-items:flex-end}
.ds{display:flex;align-items:center;gap:10px;text-align:right}
.ds img{height:30px;width:auto}.ds i+b{margin-bottom:4px}
.ds i{display:block;font-style:normal;font-size:12px;color:var(--ink-3);font-weight:600}
.ds b{display:block;font-size:15px;color:var(--ink);white-space:nowrap}
@media (max-width:720px){.namerow{flex-direction:column-reverse;align-items:flex-start;gap:8px}.ds{text-align:left}.dside{flex-direction:row;align-items:center;margin-bottom:10px}.ds img{height:24px;width:auto}}
.brand b{display:block;font-size:16px;letter-spacing:-.01em}
.brand span{display:block;font-size:10.5px;letter-spacing:.14em;color:var(--ink-3);font-weight:600}
nav.tabs{margin-left:auto;display:flex;gap:4px}
nav.tabs a{text-decoration:none;font-size:14px;font-weight:600;color:var(--ink-2);padding:8px 12px;border-radius:999px}

.eyebrow{font-size:12px;font-weight:800;letter-spacing:.16em;color:var(--crimson);text-transform:uppercase;margin:0 0 10px}
.hero{padding:44px 0 8px}
.hero h1{font-size:34px;line-height:1.25;letter-spacing:-.025em;margin:0 0 10px;font-weight:700}
.lead{color:var(--ink-2);margin:0;max-width:780px}
.depts{display:flex;flex-wrap:wrap;gap:8px;margin:22px 0 0}
.dept{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-size:13.5px;font-weight:600;color:var(--ink-2)}
.dept.on{border-color:var(--crimson);color:var(--crimson);background:var(--crimson-soft)}
.dept[disabled]{opacity:.55;cursor:not-allowed}
.dept small{font-weight:500;margin-left:4px;color:var(--ink-3)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:28px 0 0}
.stat{border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px}
.stat .k{font-size:12px;color:var(--ink-3);font-weight:600}
.stat .v{font-size:26px;font-weight:750;letter-spacing:-.02em;margin-top:2px}
.stat .v small{font-size:13px;font-weight:600;color:var(--ink-3);margin-left:4px}
.stat .s{font-size:12px;color:var(--ink-3);margin-top:2px}

section.block{padding:44px 0 0}
section.block h2{font-size:24px;letter-spacing:-.02em;margin:0 0 6px;font-weight:700}
p.sub{margin:0 0 18px;color:var(--ink-3);font-size:14px}

/* taxonomy browser */
.bigs{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.big{border:1px solid var(--line);border-radius:var(--radius);background:#fff;padding:14px 14px 12px;text-align:left;transition:border-color .15s, background .15s}
.big.on{border-color:var(--crimson);background:var(--crimson-soft)}
.big .bn{font-size:15px;font-weight:700;letter-spacing:-.01em}
.big.on .bn{color:var(--crimson-ink)}
.big .bc{font-size:12px;color:var(--ink-3);margin-top:2px}
.big .bar{height:6px;border-radius:999px;background:var(--line-2);margin-top:10px;overflow:hidden;display:flex}
.big .bar span{height:100%}
.level{margin-top:12px}
.level .lab{font-size:10.5px;font-weight:800;letter-spacing:.14em;color:var(--ink-3);text-transform:uppercase;margin:0 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.chip.on{background:var(--crimson);border-color:var(--crimson);color:#fff}
.chip .n{font-weight:500;opacity:.7;margin-left:3px}
.chip.sm{padding:4px 10px;font-size:12.5px;font-weight:550}
.chip[disabled]{opacity:.4;cursor:default}

.controls{position:sticky;top:64px;z-index:10;background:#fff;padding:14px 0 12px;border-bottom:1px solid var(--line-2);margin-top:18px}
.search{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:999px;padding:0 16px;height:46px}
.search:focus-within{border-color:var(--crimson);box-shadow:0 0 0 3px var(--crimson-soft)}
.search input{border:0;outline:0;flex:1;font:inherit;font-size:15px;background:transparent}
.search svg{flex:none;color:var(--ink-3)}
.row2{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin-top:10px}
.toggle{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2);cursor:pointer;user-select:none}
.toggle input{accent-color:var(--crimson)}
.sort{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-3)}
.sort select{font:inherit;font-size:13px;border:1px solid var(--line);border-radius:999px;padding:6px 10px;background:#fff;color:var(--ink)}
.count{font-size:13.5px;color:var(--ink-3);margin:16px 0 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.count b{color:var(--ink)}
.clear{border:0;background:none;color:var(--crimson);font-weight:650;font-size:13px;padding:0}

.search .go-btn{border:0;background:var(--crimson);color:#fff;font-weight:700;font-size:14px;border-radius:999px;padding:8px 18px;margin-right:-10px}
.search input{color:var(--ink-2);-webkit-text-fill-color:var(--ink-2);caret-color:var(--crimson);min-width:0}
.grp{margin:22px 0 0}
.grp-h{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:10px}
.grp-h b{font-size:18px;letter-spacing:-.01em}
.grp-h span{font-size:12.5px;color:var(--ink-3)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.tile{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:#fff;text-align:left}
.tile.on{border-color:var(--crimson);background:var(--crimson-soft)}
.tile .tk{font-size:14.5px;font-weight:700}
.tile .te{font-size:11.5px;color:var(--ink-3);margin-top:1px}
.tile .tn{font-size:12px;color:var(--ink-3);white-space:nowrap;text-align:right}
.tile .tn b{color:var(--ink);font-size:14px}
.qnote{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:14px 0 0;font-size:14px}
.qnote .pill{background:var(--crimson-soft);color:var(--crimson-ink);border:1px solid var(--crimson-line);border-radius:999px;padding:3px 12px;font-weight:700}
.gbtns{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.gbtn{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;background:#fff;color:var(--ink);font-size:15px;font-weight:700}
.gbtn .box{width:18px;height:18px;border-radius:50%;border:1.5px solid #c4c8d0;display:grid;place-items:center;font-size:12px;color:#fff;background:#fff}
.gbtn.on{border-color:var(--crimson);background:var(--crimson-soft);color:var(--crimson-ink)}
.gbtn .box{position:relative;flex:none}
.gbtn.on .box{background:#fff;border-color:var(--crimson);border-width:2px}
.gbtn.on .box::after{content:'';position:absolute;inset:3px;border-radius:50%;background:var(--crimson)}
.gbtn .n{font-size:12px;font-weight:600;color:var(--ink-3)}
.tile{color:var(--ink)}
.tile .tk{color:var(--ink)}
.tile.on{background:var(--crimson);border-color:var(--crimson)}
.tile.on .tk,.tile.on .te,.tile.on .tn,.tile.on .tn b{color:#fff}
.selbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.selbar .x{display:inline-flex;align-items:center;gap:6px;border:0;background:var(--crimson);color:#fff;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:650}
.panel > p.hint{display:none}
.hpy{display:flex;gap:18px;align-items:flex-end;margin-top:12px;height:96px}.hpy div{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px}.hpy span{width:28px;background:var(--crimson,#0B4EA2);border-radius:3px 3px 0 0;display:block}.hpy i{font-style:normal;color:var(--ink-3)}
.ptabs-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}.ptabs-h h3{margin:0}
.ptabs{display:inline-flex;background:#f1f2f4;border-radius:10px;padding:3px}
.ptab{border:0;background:transparent;font-size:13px;font-weight:700;color:var(--ink-3);padding:6px 12px;border-radius:8px;cursor:pointer}
.ptab.on{background:#fff;color:var(--crimson-ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.ptab-one{font-size:12px;color:var(--ink-3);font-weight:600}
.alm{font-size:12.5px;color:var(--ink-3);margin:0 0 10px}
.alm a{color:inherit;text-decoration:underline}
details.tiers{font-size:12px;color:var(--ink-3);margin:0 0 18px}
footer{margin-top:110px !important;padding-top:28px !important}
.search input::placeholder{color:#B4B9C3}
.subh{display:flex;align-items:center;gap:12px;margin:16px 0 8px;font-size:13px;font-weight:800;color:var(--ink-2);letter-spacing:.02em}
.subh::before,.subh::after{content:'';flex:1;height:1px;background:var(--line)}
.subh::before{flex:0 0 18px}
.allb{order:3;font-size:11.5px;font-weight:700;color:var(--crimson-ink);background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px 10px;cursor:pointer}
.allb.on{background:var(--crimson);color:#fff;border-color:var(--crimson)}
.subh::after{order:2}
details.tiers summary{cursor:pointer;font-weight:650}
details.tiers .trow{display:grid;grid-template-columns:28px 1fr;gap:8px;margin-top:8px}
details.tiers .vgrid span{font-size:11px;padding:1px 7px}
details.tiers p{margin:8px 0 0}
/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
a.card{display:flex;flex-direction:column;gap:11px;text-decoration:none;border:1px solid var(--line);border-radius:var(--radius);padding:18px 18px 16px;background:#fff;transition:border-color .15s, box-shadow .15s, transform .15s}
.card .head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.card h3{margin:0;font-size:17px;letter-spacing:-.015em;font-weight:700}
.card .kname{font-size:13px;color:var(--ink-3);margin-top:2px}
.card .pi{font-size:13px;font-weight:600;color:var(--ink-2);white-space:nowrap;text-align:right}
.card .pi small{display:block;font-weight:500;color:var(--ink-3);font-size:11.5px}
.path{font-size:12px;color:var(--ink-3);font-weight:600}
.path b{color:var(--crimson-ink)}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag.g{color:var(--ink-2);background:#f4f4f5;border-color:var(--line)}
.tag{display:inline-block;margin:0 4px 6px 0;font-size:11.5px;font-weight:600;color:var(--crimson-ink);background:var(--crimson-soft);border:1px solid var(--crimson-line);border-radius:999px;padding:2px 9px}
.tag.g{color:var(--ink-2);background:var(--bg-2);border-color:var(--line)}
.focus{font-size:13.5px;color:var(--ink-2);margin:0}
.mini{font-size:10.5px;font-weight:800;letter-spacing:.14em;color:var(--ink-3);text-transform:uppercase;margin-bottom:6px}
.tierbar{height:10px;border-radius:999px;overflow:hidden;display:flex;background:var(--line-2)}
.tierbar span{display:block;height:100%}
.tiernums{display:flex;gap:12px;font-size:12.5px;color:var(--ink-3);margin-top:6px;font-variant-numeric:tabular-nums;flex-wrap:wrap}
.tiernums b{color:var(--ink);font-weight:700}
.tiernums .t1 b{color:var(--crimson)}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kv div{background:var(--bg-2);border-radius:var(--radius-sm);padding:8px 10px}
.kv .k{font-size:11px;color:var(--ink-3);font-weight:600;white-space:nowrap}
.kv .v{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
.kv .v.na{font-size:12.5px;font-weight:600;color:var(--ink-3)}
.card .go{margin-top:auto;padding-top:2px;font-size:12.5px;font-weight:650;color:var(--crimson)}
.empty{border:1px dashed var(--line);border-radius:var(--radius);padding:40px;text-align:center;color:var(--ink-3)}

/* detail */
.crumb{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:24px 0 0;font-size:13px;color:var(--ink-3)}
.crumb a{text-decoration:none;color:var(--ink-2);font-weight:600}
.back{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:650;color:var(--ink-2);text-decoration:none;background:#fff}
.dhead{padding:22px 0 0}
.dhead .path{font-size:13px}
.dhead h1{font-size:36px;letter-spacing:-.03em;margin:6px 0 0;font-weight:750}
.dhead h1 small{font-size:18px;color:var(--ink-3);font-weight:550;margin-left:10px;letter-spacing:-.01em}
.dhead .labname{font-size:17px;font-weight:700;margin-top:6px}
.dhead .labname span{color:var(--ink-3);font-weight:550;font-size:14px;margin-left:8px}
.dhead .focus{font-size:15.5px;margin-top:10px;max-width:760px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:9px 16px;font-size:13.5px;font-weight:650;text-decoration:none;color:var(--ink-2);background:#fff}
.btn.pri{background:var(--crimson);border-color:var(--crimson);color:#fff}
.summary{margin:22px 0 0;padding:16px 18px;border-radius:var(--radius);background:var(--bg-2);color:var(--ink-2);font-size:14.5px}
.dgrid{display:grid;grid-template-columns:1.35fr 1fr;gap:14px;margin-top:14px}
.panel{border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;background:#fff}
.panel h3{margin:0 0 4px;font-size:16px;letter-spacing:-.01em}
.panel .hint{font-size:12.5px;color:var(--ink-3);margin:0 0 14px}
.ybars{display:flex;align-items:flex-end;gap:18px;height:170px;padding:6px 4px 0;border-bottom:1px solid var(--line)}
.ycol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px}
.ycol .n{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}

function morph(a, b){
  if (a.nodeType !== b.nodeType || a.nodeName !== b.nodeName) { a.replaceWith(b); return; }
  if (a.nodeType === 3) { if (a.nodeValue !== b.nodeValue) a.nodeValue = b.nodeValue; return; }
  if (a.nodeType !== 1) return;
  for (const at of [...a.attributes]) if (!b.hasAttribute(at.name)) a.removeAttribute(at.name);

  bc.forEach((n, i) => ac[i] ? morph(ac[i], n) : a.appendChild(n));
  for (let i = bc.length; i < ac.length; i++) ac[i].remove();
}

const NORM = s => String(s||'').toLowerCase().replace(/[\s\-_&·.,/()'’]+/g,'');

function qparts(){ const n = NORM(state.q); const core = n.replace(SUFFIX,''); return {n, core: core.length >= 2 ? core : n}; }
function nameRank(l){
  if (!state.q) return 9;
  const {n, core} = qparts(); const s = NORM(l.short), k = NORM(l.name), sc = s.replace(SUFFIX,''), kc = k.replace(SUFFIX,'');
  if (s === n || sc === core || k === n || kc === core) return 0;
  if (s.startsWith(core) || k.startsWith(core)) return 1;
  const words = (l.short+' '+l.name).toLowerCase().split(/[^0-9a-z가-힣]+/).filter(Boolean);
  if (/[가-힣]/.test(core) ? k.includes(core) : words.some(w => w.startsWith(core))) return 2;
  if (l.pis.concat(l.pisEn).some(p => NORM(p).includes(n))) return 3;

}
function matches(l){
  if (state.sel.size) { if (![...state.sel].some(f => hasFine(l, f))) return false; }
  else if (state.open.size && !l.tax.some(t => state.open.has(t.big))) return false;
  if (state.q) {
    if (nameRank(l) < 9) return true;
    const hay = [l.short, l.name, l.focus, ...l.pis, ...l.pisEn, ...l.tax.flatMap(t => [BIG[t.big].name, MID[t.mid].name, ...t.fine, ...t.fine.map(enOf)]), ...(l.pubs ? l.pubs.recent.map(r => r.title) : []),

    if (!hay.replace(/[-_]/g,' ').includes(state.q.toLowerCase().replace(/[-_]/g,' ').replace(/\s+/g,' '))) return false;
  }

}

function yearChart(p, single){
  const ys = [2024, 2025, 2026];
  const max = Math.max(1, ...ys.map(y => { const c=p.years[y]; return c.T1+c.T2+c.W+c.etc; }));
  const cols = ys.map(y => {
    const c = p.years[y]; const t = c.T1+c.T2+c.W+c.etc; const h = t/max*130;
    const seg = single ? (t?`<span style="height:${h}px;background:var(--t1)"></span>`:'') : [['t1',c.T1],['t2',c.T2],['w',c.W],['etc',c.etc]].filter(x=>x[1]).map(([k,v]) => `<span style="height:${v/t*h}px;background:var(--${k})" title="${v}"></span>`).join('');

      ${yearChart(p)}
      <div class="k" style="margin:18px 0 8px">자주 발표한 학회·저널</div>
      <div class="vtop">${top.map(([t,lb,n]) => `<div class="vrow"><div class="vn"><span class="badge ${t}">${t==='W'?'워크숍':t}</span>${esc(lb)}</div><div class="vc">${n}편</div><div class="vb"><span style="width:${n/vmax*100}%;background:var(--${t==='T1'?'t1':t==='T2'?'t2':t==='W'?'w':'etc'})"></span></div></div>`).join('')}</div>
      ${p.venues.length>5?`<div class="vall">${p.venues.slice(5).map(([t,lb,n]) => `<span class="v-pill ${t}">${esc(lb)} ${n}</span>`).join('')}</div>`:''}`]);
  }
  if (l.hp) {
    const hp = l.hp; const yrs = {}; [2024,2025,2026].forEach(y => yrs[y] = {T1:0,T2:0,W:0,etc:hp.years[y]||0});
    views.push(['hp', '연구실 홈페이지', `<p class="alm">2024–2026 · 연구실 홈페이지 Publications 목록 자동 집계 · 국내 학회·저널 포함 · arXiv·투고 중 제외</p>
      <div class="kpis"><div>총<b>${hp.n}</b></div><div>연평균<b>${(hp.n/3).toFixed(1)}</b></div>${hp.T1!=null?`<div>T1 추정<b>${hp.T1}</b></div><div>T2 추정<b>${hp.T2}</b></div>`:''}</div>
      ${yearChart({years:yrs}, true)}
      ${hp.venues.length?`<div class="k" style="margin:18px 0 8px">자주 나온 학회·저널</div><div>${hp.venues.map(v=>`<span class="tag g">${esc(v)}</span>`).join('')}</div>`:''}
      <p class="alm" style="margin-top:12px">페이지 형식이 제각각이라 일부 누락·중복이 있을 수 있어요.</p>`]);
  }
  if (views.length) {
    perf = `<div class="panel full"><div class="ptabs-h"><h3>논문 실적</h3>${views.length>1?`<div class="ptabs">${views.map((v,i)=>`<button class="ptab ${i?'':'on'}" data-v="${v[0]}">${v[1]}</button>`).join('')}</div>`:`<span class="ptab-one">${views[0][1]} 기준</span>`}</div>
      ${views.map((v,i)=>`<div class="pview" data-v="${v[0]}" ${i?'hidden':''}>${v[2]}</div>`).join('')}</div>`;
  } else {
    perf = `<div class="panel full"><h3>논문 실적</h3><p class="alm">${p ? 'dblp에 2024–26년 학회·저널 논문 기록이 없어요. 연구실 홈페이지의 논문 목록을 확인하세요.' : esc(l.pubNote) + ' — 연구실 홈페이지의 논문 목록을 확인하세요.'}</p></div>`;
  }
  const rec = p && p.recent.length ? `<div class="panel full"><h3>최근 논문</h3><p class="hint">최신순 ${p.recent.length}편 · dblp 기준. 인턴 이름은 <mark style="background:var(--crimson-soft);color:var(--crimson-ink);border-radius:4px;padding:0 3px">강조</mark> 표시.</p>
    <div class="plist">${[...p.recent].sort((a,b)=>b.y-a.y).map(r => {
      let au = esc(r.authors); r.interns.forEach(n => { au = au.split(esc(n)).join(`<mark>${esc(n)}</mark>`); });
      const intNote = r.interns.length && !r.authors.includes(r.interns[0]) ? ` · 인턴 저자: <mark>${r.interns.map(esc).join(', ')}</mark>` : '';
      return `<div class="paper"><div class="meta"><span class="badge ${r.tier}">${r.tier==='W'?'워크숍':r.tier}</span>${esc(r.venue)} · ${r.y}</div>
        <div class="t"><a href="https://dblp.org/rec/${esc(r.key)}.html" target="_blank" rel="noopener">${esc(r.title)}</a></div><div class="au">${au}${intNote}</div></div>`; }).join('')}</div>
    ${l.dblp.length?`<p class="hint" style="margin:12px 0 0">전체 목록은 ${l.dblp.map((u,i)=>`<a href="${u}" target="_blank" rel="noopener">dblp${l.dblp.length>1?' ('+esc(l.pis[i])+')':''}</a>`).join(', ')}${l.pubSrc?` 또는 <a href="${esc(l.pubSrc)}" target="_blank" rel="noopener">연구실 논문 페이지</a>`:''}에서 확인하세요.</p>`:''}</div>` : '';
  const iv = v => v;
  const al = l.alumni;
  const chips = arr => arr.map(x => `<span class="tag g">${esc(x)}</span>`).join(' ');
  const alum = `<div class="panel"><h3>졸업생 진로</h3>${al ? `<p class="alm">${al.n}명${al.acaPct!=null?` · 학계 ${al.acaPct}% · 산업계 ${al.indPct}%`:''}${al.extra?` · ${esc(al.extra)}`:''}</p>
      ${al.ind && al.ind.length ? `<div class="k" style="margin:10px 0 6px">산업계</div><div>${chips(al.ind)}</div>` : ''}
      ${al.aca && al.aca.length ? `<div class="k" style="margin:12px 0 6px">학계·연구소</div><div>${chips(al.aca)}</div>` : ''}
      ${!(al.ind&&al.ind.length)&&!(al.aca&&al.aca.length) ? '<p class="alm">진로가 공개된 졸업생이 없어요.</p>' : ''}
      <p class="alm" style="margin-top:12px">출처: <a href="${al.src}" target="_blank" rel="noopener">${esc(al.srcName)}</a></p>` : '<p class="alm">아직 수집하지 않았거나 공개된 졸업생 정보가 없어요.</p>'}</div>`;
  const intern = `<div class="panel"><h3>학부 인턴</h3><p class="hint">공개 정보 기준 추정치</p>
    <div class="ibig">
      <div><div class="k">현재 인턴</div>${l.internsCur==null?`<div class="v na">${internNA(l)}</div>`:`<div class="v">${l.internsCur}명</div>`}</div>
      <div><div class="k">예전 인턴 (공개)</div>${l.internsCur==null&&!l.pastListed?`<div class="v na">${internNA(l)}</div>`:(l.pastListed?`<div class="v">${l.internsPast}명</div>`:'<div class="v na">Unknown</div>')}</div>
      <div><div class="k">인턴 저자 논문</div>${ii.status==='ok'?`<div class="v">${Math.round(ii.pct*100)}%</div><div class="s">${ii.hit}/${ii.total}편 (현재 ${p.internCur} · 예전 ${p.internPast})</div>`:`<div class="v na">${ii.label}</div>`}</div>
    </div>
    <ul class="notes">
      ${l.memberSrc==null?'<li>이 연구실의 구성원·인턴 정보는 아직 수집하지 않았어요.</li>':(l.internsCur==null?'<li>홈페이지에 인턴·학부연구생 항목이 없어요. 0명이라는 뜻이 아니에요.</li>':'')}
      ${l.internsCur!=null&&!l.pastListed?'<li>예전 인턴 명단이 없어 현재 인턴만으로 셌어요. 현재 인턴은 대부분 최근 합류해 비율이 낮게 나올 수 있어요.</li>':''}
      ${l.internNamesKoreanOnly?'<li>인턴 이름이 한글로만 공개돼 영문 저자명과 맞출 수 없었어요.</li>':''}
      ${ii.status==='ok'?'<li>영문 이름이 완전히 같은 저자만 셌어요. 동명이인이나 표기 차이로 오차가 있을 수 있어요.</li>':''}
    </ul></div>`;
  const mp = memberParts(l);
  const mem = `<div class="panel"><h3>구성원</h3><p class="hint">${l.members?'연구실 홈페이지 기준 (2026-11-19, 자동 집계라 실제와 다를 수 있어요)':'홈페이지 정보 없음'}</p>
    ${mp && mp.length ? `<div class="mgrid">${mp.map(([k,v,s]) => `<div><div class="k">${k}</div>${v==null?'<div class="v na">미공개</div>':`<div class="v">${v}</div>`}${s?`<div class="hint" style="margin:0">${s}</div>`:''}</div>`).join('')}</div>` : '<div class="hint">구성원 명단이 공개돼 있지 않아요.</div>'}
    ${l.note?`<ul class="notes"><li>${esc(l.note)}</li></ul>`:''}</div>`;
  const sims = l.similar.length ? `<section class="block" style="padding-top:28px"><p class="eyebrow">Similar Labs</p><h2>비슷한 분야의 연구실</h2><p class="sub">세부 분야가 많이 겹치는 순서예요.</p>
    <div class="sims">${l.similar.map(id => { const o = byId[id]; return `<a class="card" href="#lab-${o.slug}"><div class="head"><div><h3 style="font-size:15.5px">${esc(o.short)}</h3><div class="kname">${esc(o.pis.join('·'))} 교수</div></div></div><div class="tags">${finesOf(o).slice(0,3).map(f=>`<span class="tag">${esc(f)}</span>`).join('')}</div>${o.pubs&&o.pubs.total?`<div class="tiernums"><span class="t1">T1 <b>${o.pubs.T1}</b></span><span>총 <b>${o.pubs.total}</b>편</span></div>`:''}</a>`; }).join('')}</div></section>` : '';
  const src = `<p class="hint src" style="margin-top:28px;font-size:12.5px;color:var(--ink-3)">출처: ${[l.url&&`<a href="${esc(l.url)}" target="_blank" rel="noopener">연구실 홈페이지</a>`, l.memberSrc&&`<a href="${esc(l.memberSrc)}" target="_blank" rel="noopener">구성원 페이지</a>`, l.pubSrc&&`<a href="${esc(l.pubSrc)}" target="_blank" rel="noopener">논문 페이지</a>`, ...l.dblp.map(u=>`<a href="${u}" target="_blank" rel="noopener">dblp</a>`)].filter(Boolean).join(' · ')} · 수집일 ${D.generated}</p>`;
  return `${crumb}${head}<div class="summary">${esc(summaryText(l))}</div>${stats}
    <div class="dgrid">${perf}${rec}${tax}${intern}${mem}${alum}</div>${sims}${src}`;
}

/* ---------- routing (#lab-slug, #area-big[-mid[-fine]]) ---------- */
let listScroll = 0;
function route(){
  const h = decodeURIComponent(location.hash.slice(1));
  if (h.startsWith('lab-') && bySlug[h.slice(4)]) {
    if (!$('#listView').classList.contains('hidden')) listScroll = window.scrollY;
    $('#listView').classList.add('hidden');
    const dv = $('#detailView'); dv.innerHTML = detail(bySlug[h.slice(4)]); dv.classList.remove('hidden'); dv.classList.remove('fadein'); void dv.offsetWidth; dv.classList.add('fadein');
    dv.querySelectorAll('.ptab').forEach(b => b.onclick = () => { dv.querySelectorAll('.ptab').forEach(x => x.classList.toggle('on', x===b)); dv.querySelectorAll('.pview').forEach(v => v.hidden = v.dataset.v !== b.dataset.v); });
    document.title = `${bySlug[h.slice(4)].pis.join('·')} 교수 연구실 ${bySlug[h.slice(4)].short} | 컴랩 · KAIST`;
    window.scrollTo(0, 0);
    return;
  }
  const wasDetail = !$('#detailView').classList.contains('hidden'); $('#detailView').classList.add('hidden'); $('#listView').classList.remove('hidden'); if (wasDetail) { const lv = $('#listView'); lv.classList.remove('fadein'); void lv.offsetWidth; lv.classList.add('fadein'); }
  document.title = '컴랩 · KAIST — 카이스트 컴퓨터·AI 연구실';
  if (h.startsWith('area-')) {
    const [b, m, f] = h.slice(5).split('-');
    const ff = MID[m] && f != null ? MID[m].fine[+f] : null; state.q=''; $('#q').value='';
    if (ff) { state.sel = new Set([ff]); state.open = new Set([MID[m].big]); }
    render(); document.getElementById('results').scrollIntoView();
    return;
  }
  render();
  if (h === 'venues') document.getElementById(h).scrollIntoView();
  else if (h === '') window.scrollTo(0, listScroll);
}
window.addEventListener('hashchange', route);
route();
(function(){ const b = document.getElementById('boot'); if (!b) return;
  const hide = () => { b.classList.add('done'); setTimeout(() => b.remove(), 400); };
  const loaded = new Promise(r => document.readyState === 'complete' ? r() : addEventListener('load', r)).then(() => document.fonts && document.fonts.ready);
  Promise.race([loaded, new Promise(r => setTimeout(r, 1500))]).then(() => requestAnimationFrame(hide));
})();
})();
</script>
